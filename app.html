<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeetingTax - the meter is always running</title>
<style>
  :root { --bg:#141118; --panel:#1c1724; --line:#332845; --text:#f5f1fa; --dim:#a294bd; --accent:#ffb45a; --good:#8be0a4; --warn:#ffcf7a; --bad:#ff8f7a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 14px 44px; }
  h1 { font-size:30px; }
  .sub { color:var(--dim); margin:6px 0 18px; font-size:14px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; width:min(640px, 94vw); margin-bottom:14px; }
  .card h2 { font-size:15px; margin-bottom:10px; }
  .row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  input, select { background:#100c16; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px 10px; font-size:13px; }
  label { color:var(--dim); font-size:11px; display:block; margin-bottom:4px; }
  button { background:var(--accent); color:#141118; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  .att { display:grid; grid-template-columns:1fr 90px 70px 28px; gap:8px; align-items:center; background:#100c16; border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-top:6px; font-size:13px; }
  .att .x { color:var(--dim); cursor:pointer; text-align:center; }
  .att .x:hover { color:var(--bad); }
  .ticker { text-align:center; padding:8px 0 2px; }
  .ticker .cost { font-size:56px; font-weight:900; font-variant-numeric:tabular-nums; }
  .ticker .elapsed { color:var(--dim); font-size:14px; margin-top:4px; font-variant-numeric:tabular-nums; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:8px; margin-top:14px; }
  .stat { background:#100c16; border:1px solid var(--line); border-radius:10px; padding:10px 12px; text-align:center; }
  .stat .n { font-size:18px; font-weight:900; }
  .stat .l { color:var(--dim); font-size:11px; margin-top:2px; }
  .controls { display:flex; gap:10px; justify-content:center; margin-top:14px; }
  .ghost { background:#2a2138; color:var(--text); }
  .verdict { text-align:center; margin-top:12px; }
  .vchip { font-size:13px; font-weight:700; padding:4px 16px; border-radius:20px; }
  .v-cheap { background:var(--good); color:#141118; }
  .v-normal { background:var(--warn); color:#141118; }
  .v-pricey { background:var(--accent); color:#141118; }
  .v-email { background:var(--bad); color:#141118; }
  .empty { color:var(--dim); text-align:center; padding:10px 0; font-size:14px; }
  .foot { margin-top:14px; color:var(--dim); font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<h1>MeetingTax</h1>
<div class="sub">eight people, one hour, nobody sees the meter. start the clock when the meeting starts.</div>

<div class="card">
  <div class="ticker">
    <div class="cost" id="cost">$0.00</div>
    <div class="elapsed" id="elapsed">00:00 - add attendees and start the clock</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="n" id="s-hc">0</div><div class="l">people</div></div>
    <div class="stat"><div class="n" id="s-blend">$0</div><div class="l">blended $/hour</div></div>
    <div class="stat"><div class="n" id="s-per">$0</div><div class="l">per person so far</div></div>
    <div class="stat"><div class="n" id="s-annual">$0</div><div class="l">if weekly, per year</div></div>
  </div>
  <div class="controls">
    <button id="start">Start the meter</button>
    <button id="stop" class="ghost" style="display:none">Meeting over</button>
    <button id="reset" class="ghost" style="display:none">Reset</button>
  </div>
  <div class="verdict" id="verdict"></div>
</div>

<div class="card">
  <h2>Who's in the room</h2>
  <div id="attendees"><div class="empty">Nobody yet.</div></div>
  <div class="row" style="margin-top:10px">
    <div><label>Role</label><select id="a-role">
      <option value="Intern|25">Intern - $25/h</option>
      <option value="Junior|45">Junior - $45/h</option>
      <option value="Mid|65" selected>Mid - $65/h</option>
      <option value="Senior|90">Senior - $90/h</option>
      <option value="Manager|110">Manager - $110/h</option>
      <option value="Exec|180">Exec - $180/h</option>
    </select></div>
    <div><label>How many</label><input id="a-count" type="number" min="1" step="1" value="1" style="width:70px"></div>
    <button id="add">Add</button>
  </div>
</div>

<div class="foot"><a href="index.html">&larr; about</a></div>

<script src="engine.js?v=1"></script>
<script>
(function () {
  var KEY = 'meetingtax-v1';
  var attendees = [];
  var startAt = null, elapsedBefore = 0, timer = null;

  function save() { try { localStorage.setItem(KEY, JSON.stringify(attendees)); } catch (e) {} }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) attendees = s; } catch (e) {}
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function money(n) { return '$' + n.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
  function money0(n) { return '$' + Math.round(n).toLocaleString(); }
  function elapsedSeconds() {
    return elapsedBefore + (startAt ? Math.floor((Date.now() - startAt) / 1000) : 0);
  }
  function fmtTime(s) {
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  function renderAttendees() {
    var el = document.getElementById('attendees');
    if (!attendees.length) { el.innerHTML = '<div class="empty">Nobody yet.</div>'; }
    else {
      el.innerHTML = '';
      attendees.forEach(function (a) {
        var row = document.createElement('div');
        row.className = 'att';
        row.innerHTML = '<span>' + esc(a.role) + '</span><span>&times;' + a.count + '</span><span>$' + a.hourly + '/h</span>' +
          '<span class="x" data-id="' + a.id + '">&times;</span>';
        el.appendChild(row);
      });
      el.querySelectorAll('.x').forEach(function (x) {
        x.addEventListener('click', function () {
          attendees = attendees.filter(function (a) { return a.id !== x.getAttribute('data-id'); });
          save(); renderAll();
        });
      });
    }
  }

  function renderStats() {
    var secs = elapsedSeconds();
    var total = MeetingTax.cost(attendees, secs);
    var hc = MeetingTax.headcount(attendees);
    document.getElementById('cost').textContent = money(total);
    document.getElementById('elapsed').textContent = fmtTime(secs) + (startAt ? ' - meter running' : secs ? ' - meter stopped' : ' - add attendees and start the clock');
    document.getElementById('s-hc').textContent = hc;
    document.getElementById('s-blend').textContent = money0(MeetingTax.blendedHourly(attendees));
    document.getElementById('s-per').textContent = hc ? money(total / hc) : '$0';
    document.getElementById('s-annual').textContent = money0(MeetingTax.annualized(attendees, secs || 3600, 1));
  }

  function renderAll() { renderAttendees(); renderStats(); }

  document.getElementById('add').addEventListener('click', function () {
    var parts = document.getElementById('a-role').value.split('|');
    var count = parseInt(document.getElementById('a-count').value, 10);
    if (!count || count < 1) return;
    attendees.push({ id: 'a' + Date.now(), role: parts[0], hourly: +parts[1], count: count });
    document.getElementById('a-count').value = '1';
    save(); renderAll();
  });

  document.getElementById('start').addEventListener('click', function () {
    if (!attendees.length) return;
    startAt = Date.now();
    document.getElementById('start').style.display = 'none';
    document.getElementById('stop').style.display = '';
    document.getElementById('reset').style.display = 'none';
    document.getElementById('verdict').innerHTML = '';
    timer = setInterval(renderStats, 1000);
    renderStats();
  });

  document.getElementById('stop').addEventListener('click', function () {
    elapsedBefore = elapsedSeconds();
    startAt = null;
    clearInterval(timer);
    document.getElementById('stop').style.display = 'none';
    document.getElementById('reset').style.display = '';
    var total = MeetingTax.cost(attendees, elapsedBefore);
    var v = MeetingTax.verdict(total);
    document.getElementById('verdict').innerHTML = '<span class="vchip v-' + v.tier + '">' + v.label + '</span>';
    renderStats();
  });

  document.getElementById('reset').addEventListener('click', function () {
    elapsedBefore = 0;
    document.getElementById('reset').style.display = 'none';
    document.getElementById('start').style.display = '';
    document.getElementById('verdict').innerHTML = '';
    renderStats();
  });

  // test hook
  window.__mt = {
    clear: function () { attendees = []; save(); renderAll(); },
    add: function (role, hourly, count) {
      attendees.push({ id: 'a' + Math.random(), role: role, hourly: hourly, count: count });
      save(); renderAll();
    },
    simulate: function (seconds) {
      elapsedBefore = seconds; startAt = null; clearInterval(timer);
      var total = MeetingTax.cost(attendees, seconds);
      var v = MeetingTax.verdict(total);
      document.getElementById('stop').style.display = 'none';
      document.getElementById('reset').style.display = '';
      document.getElementById('start').style.display = 'none';
      document.getElementById('verdict').innerHTML = '<span class="vchip v-' + v.tier + '">' + v.label + '</span>';
      renderStats();
    },
    read: function () {
      return {
        cost: document.getElementById('cost').textContent,
        elapsed: document.getElementById('elapsed').textContent,
        hc: document.getElementById('s-hc').textContent,
        blend: document.getElementById('s-blend').textContent,
        per: document.getElementById('s-per').textContent,
        annual: document.getElementById('s-annual').textContent,
        verdict: document.getElementById('verdict').textContent
      };
    }
  };

  load();
  renderAll();
})();
</script>
</body>
</html>
